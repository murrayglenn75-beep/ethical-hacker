name: Scion-inspired Git gate tests
on:
  pull_request:
  push:
    branches:
      - feature/scion-inspired-change-gates-20261013
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tooling -p 'test_scion_git_gates.py' -v
