name: Guarded Repair Triage Tests
on:
  pull_request:
  push:
    branches:
      - feature/guarded-repair-triage-20261013
permissions:
  contents: read
jobs:
  triage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tooling -p 'test_repair_triage.py' -v
      - run: python -m unittest discover -s tooling -p 'test_ci_failure_collector.py' -v
      - run: python -m unittest discover -s tooling -p 'test_repair_handoff.py' -v
      - run: python -m unittest discover -s tooling -p 'test_repair_worktree_runner.py' -v
