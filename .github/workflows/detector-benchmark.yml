name: Detector benchmark
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  detector-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run existing regression suite
        run: npm test
      - name: Run labeled synthetic detector checks
        run: node tests/benchmark-detectors.js
