name: CI Failure Repair Report
on:
  workflow_run:
    workflows:
      - Artifact inspector regression
      - Guarded Repair Triage Tests
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create bounded failure summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (context.eventName === 'workflow_dispatch') {
              fs.writeFileSync('failure-input.json', JSON.stringify({
                name:'Manual test fixture', conclusion:'failure',
                html_url:'https://github.com/owner/repo/actions/runs/123',
                jobs:[{name:'synthetic-unit',conclusion:'failure',steps:[{name:'synthetic-check',conclusion:'failure'}]}]
              }));
            } else {
              const run = context.payload.workflow_run;
              const response = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{
                owner:context.repo.owner,repo:context.repo.repo,run_id:run.id,per_page:100
              });
              fs.writeFileSync('failure-input.json',JSON.stringify({
                name:run.name,conclusion:run.conclusion,html_url:run.html_url,
                jobs:response.slice(0,200).map(j=>({
                  name:j.name,conclusion:j.conclusion,
                  steps:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>({name:s.name,conclusion:s.conclusion}))
                }))
              }));
            }
      - name: Produce read-only repair plan
        run: python tooling/ci_failure_collector.py failure-input.json repair-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: guarded-repair-plan
          path: repair-plan.json
          retention-days: 7
