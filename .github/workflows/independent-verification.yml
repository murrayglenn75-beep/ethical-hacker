name: Ethical Hacker independent regression gate
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Murray Method evidence preflight regression
        run: python -m unittest discover -s engineering -p 'test_*.py' -q
      - name: Run deterministic regression tests (including security fail-closed checks)
        run: npm test
      - name: Run stress suite
        run: npm run stress
