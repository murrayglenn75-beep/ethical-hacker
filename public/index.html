<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethical Hacker v1</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#e8eefc}.wrap{max-width:1000px;margin:auto;padding:32px}.card{background:#131a2f;border:1px solid #27304a;border-radius:14px;padding:18px;margin:14px 0}h1{margin:0 0 8px}.muted{color:#9fb0d0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{font-size:28px;font-weight:700}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#243152}pre{white-space:pre-wrap}</style></head><body><div class="wrap"><h1>Ethical Hacker v1</h1><p class="muted">Continuous integrity, attack-path, and build-gate dashboard.</p><div class="grid"><div class="card"><div class="muted">Risk state</div><div id="status" class="metric">—</div></div><div class="card"><div class="muted">Findings</div><div id="findings" class="metric">—</div></div><div class="card"><div class="muted">Graph nodes</div><div id="nodes" class="metric">—</div></div><div class="card"><div class="muted">Graph edges</div><div id="edges" class="metric">—</div></div></div><div class="card"><h3>Build gate</h3><pre id="gate">Loading…</pre></div></div><script>async function go(){const s=await fetch('/api/status').then(r=>r.json());status.textContent=s.risk.status;findings.textContent=s.risk.findings;nodes.textContent=s.graph.nodes.length;edges.textContent=s.graph.edges.length;const g=await fetch('/api/gate').then(r=>r.json());gate.textContent=JSON.stringify(g,null,2)}go()</script></body></html>
